name: "Clash Proxy"
description: "Clash Proxy"
version: "1.19.1"
slug: "clash"
init: false
image: registry.cn-shanghai.aliyuncs.com/lebai/clash
arch:
  - aarch64
  - amd64
options:
  tproxy:
    enable: false
    host_interface: "end0"
    clash_interface: "clash"
    clash_ip: "192.168.1.2"
    gateway_ip: "192.168.1.1"
    subnet_mask: "24"
  tun:
    enable: false
  clash_url: "http://"
schema:
  tproxy:
    enable: bool
    host_interface: str
    clash_interface: str
    clash_ip: str
    gateway_ip: str
    subnet_mask: str
  tun:
    enable: bool
  clash_url: str?
  ssr_url: str?
privileged:
  - NET_ADMIN
host_network: true
devices:
  - /dev/net/tun
ports:
  53/udp: 53
  7890/tcp: 7890
  9090/tcp: 9090
